name: Daily AI Shorts — AI Tool Drop

# Fully automatic and GPU-free: real HD stock footage + AI script + voice.
# Cron is UTC. 11:00 UTC ≈ early morning US, leaving time to build before the
# US prime-time publish slots.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      shorts_per_day:
        description: "How many shorts on THIS run (test = 1)"
        required: false
        default: "1"
      privacy:
        description: "public / unlisted / private (this run)"
        required: false
        default: "unlisted"
      schedule_to_peak:
        description: "Schedule to prime time? true/false (this run)"
        required: false
        default: "false"
      theme:
        description: "Optional angle, e.g. 'free ai tools for students'"
        required: false
        default: ""
      no_upload:
        description: "Build only, skip posting (true/false)"
        required: false
        default: "false"

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          fi
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          fi

      - name: Run daily pipeline
        env:
          # --- content / AI ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_FORMAT: ai_shorts
          # --- free stock footage (real HD video) ---
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # --- voice ---
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-GuyNeural' }}
          NARRATION_MODE: narrate
          # --- how many + how to publish ---
          SHORTS_PER_DAY: ${{ github.event.inputs.shorts_per_day || vars.SHORTS_PER_DAY || '2' }}
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
          SCHEDULE_TO_PEAK: ${{ github.event.inputs.schedule_to_peak || vars.SCHEDULE_TO_PEAK || 'true' }}
          UPLOAD_TARGETS: youtube
          # --- audience timing ---
          TARGET_TIMEZONE: America/New_York
          USA_TIMEZONE: America/New_York
          INDIA_TIMEZONE: Asia/Kolkata
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI Tool Drop' }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@aitooldrop' }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then EXTRA="--no-upload"; fi
          if [ -n "${{ github.event.inputs.theme }}" ]; then EXTRA="$EXTRA --theme \"${{ github.event.inputs.theme }}\""; fi
          eval python -m src.pipeline --once $EXTRA

      - name: Upload artifacts (built shorts)
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts
          path: |
            output/**/shorts/*.mp4
            output/**/storyboard.json
            output/**/summary.json
          retention-days: 7
          if-no-files-found: ignore
