name: Daily Vlog — Jon & Katie

# Runs every day. Cron is in UTC. 12:00 UTC ≈ early morning US, giving the
# pipeline time to build videos before the afternoon peak-publish slots.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      theme:
        description: "Optional story theme"
        required: false
        default: ""
      no_upload:
        description: "Build only, skip posting (true/false)"
        required: false
        default: "false"

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets (YouTube token + Meta)
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          fi

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AriaNeural' }}
          NARRATION_MODE: ${{ vars.NARRATION_MODE || 'narrate' }}
          VIDEO_BACKEND: ${{ vars.VIDEO_BACKEND || 'stub' }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          TARGET_TIMEZONE: ${{ vars.TARGET_TIMEZONE || 'America/New_York' }}
          CHANNEL_NAME: "Jon & Katie"
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then EXTRA="--no-upload"; fi
          if [ -n "${{ github.event.inputs.theme }}" ]; then EXTRA="$EXTRA --theme \"${{ github.event.inputs.theme }}\""; fi
          eval python -m src.pipeline --once $EXTRA

      - name: Upload artifacts (videos + summary)
        uses: actions/upload-artifact@v4
        with:
          name: daily-output
          path: output/**
          retention-days: 7
          if-no-files-found: ignore
