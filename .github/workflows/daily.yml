name: Daily Shorts — trending news (auto)

# Fully automatic and GPU-free: real HD stock footage + AI script + voice.
# Cron is UTC. 18:00 UTC ≈ 2:00 PM ET — builds a few hours before the first
# evening slot (6:00 PM ET), so all 6 shorts are queued for evening → late night.
# Viral-news mode runs 3x/day so stories are still hot when they publish.
# 16:00 UTC = 12pm ET, 20:00 UTC = 4pm ET, 00:00 UTC = 8pm ET (US afternoon ->
# evening). 2 shorts per run = 6/day, which is exactly the free YouTube quota.
on:
  schedule:
    - cron: "0 16,20 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      shorts_per_day:
        description: "How many shorts on THIS run (test = 1)"
        required: false
        default: "1"
      privacy:
        description: "public / unlisted / private (this run)"
        required: false
        default: "public"
      schedule_to_peak:
        description: "Schedule to prime time? true/false (this run)"
        required: false
        default: "false"
      theme:
        description: "Optional angle, e.g. 'free ai tools for students'"
        required: false
        default: ""
      no_upload:
        description: "Build only, skip posting (true/false)"
        required: false
        default: "false"

permissions:
  contents: write       # needed to commit content/history.json (lifelong memory)
  actions: write        # needed to prune old artifacts

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail fast: without a stock provider every video would be blank.
      - name: Check required secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          fail=0
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::No stock footage key. Add PEXELS_API_KEY (free: pexels.com/api)."
            fail=1
          fi
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::warning::YOUTUBE_TOKEN_JSON missing - uploads will be skipped."
          fi
          exit $fail

      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          fi
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          fi

      - name: Run daily pipeline
        env:
          # --- content / AI ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Second free writer (console.groq.com, no card). Optional but strongly
          # recommended: if Gemini is rate-limited, Groq keeps ideas original.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # --- viral news mode ---
          # Real trending stories (Google Trends/News, Reddit, Wikipedia).
          # Set CONTENT_FORMAT=ai_shorts to go back to evergreen AI tips.
          TRENDS_GEO: ${{ vars.TRENDS_GEO || 'US' }}
          TRENDS_LANG: ${{ vars.TRENDS_LANG || 'en' }}
          # A story must appear in at least this many independent sources.
          MIN_TREND_SOURCES: ${{ vars.MIN_TREND_SOURCES || '2' }}
          # Politics is OFF by default: low ad rates + strike risk.
          ALLOW_POLITICS: ${{ vars.ALLOW_POLITICS || 'false' }}
          # Don't re-cover the same story within this many days.
          STORY_WINDOW_DAYS: ${{ vars.STORY_WINDOW_DAYS || '7' }}
          # A tip idea may be revisited after this long (titles/hooks: never).
          IDEA_REUSE_DAYS: ${{ vars.IDEA_REUSE_DAYS || '365' }}
          CONTENT_FORMAT: ${{ vars.CONTENT_FORMAT || 'viral_news' }}
          # --- free stock footage (real HD video) ---
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # --- optional: AI b-roll on Modal's free GPU credits ---
          AI_BROLL: ${{ vars.AI_BROLL || 'false' }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # --- voice ---
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-GuyNeural' }}
          NARRATION_MODE: narrate
          # pacing: faster delivery + tiny breath between lines (no dead gaps)
          TTS_RATE: ${{ vars.TTS_RATE || '+10%' }}
          SCENE_PAD: ${{ vars.SCENE_PAD || '0.12' }}
          # --- how many + how to publish ---
          # Per RUN (news mode runs 3x/day) -> 2 x 3 = 6/day = free quota.
          SHORTS_PER_DAY: ${{ github.event.inputs.shorts_per_day || vars.SHORTS_PER_DAY || '2' }}
          # quality + housekeeping
          VIDEO_QUALITY: ${{ vars.VIDEO_QUALITY || 'hd' }}
          VIDEO_CRF: ${{ vars.VIDEO_CRF || '18' }}
          CLEANUP_AFTER_UPLOAD: "true"
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
          SCHEDULE_TO_PEAK: ${{ github.event.inputs.schedule_to_peak || vars.SCHEDULE_TO_PEAK || 'true' }}
          UPLOAD_TARGETS: youtube
          # --- audience timing ---
          TARGET_TIMEZONE: America/New_York
          USA_TIMEZONE: America/New_York
          INDIA_TIMEZONE: Asia/Kolkata
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI Tool Drop' }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@aitooldrop' }}
          # 25 = News & Politics (correct for a trending-news channel).
          # Use 28 (Science & Technology) if you switch back to ai_shorts.
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '25' }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then EXTRA="--no-upload"; fi
          if [ -n "${{ github.event.inputs.theme }}" ]; then EXTRA="$EXTRA --theme \"${{ github.event.inputs.theme }}\""; fi
          eval python -m src.pipeline --once $EXTRA

      # LIFELONG MEMORY: commit the updated history so the channel never repeats
      # a topic, hook, idea, clip or thumbnail style. The runner is wiped after
      # every run, so this file is the only permanent record.
      - name: Commit channel memory
        if: always()
        run: |
          if [ ! -f content/history.json ]; then
            echo "no history file produced; nothing to commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/history.json
          if git diff --cached --quiet; then
            echo "memory unchanged"; exit 0
          fi
          git commit -m "chore(memory): record published topics/hooks/clips [skip ci]"
          # Rebase on top of anything pushed meanwhile, then push.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          echo "memory committed: $(python -c 'import json;d=json.load(open("content/history.json"));print(len(d["titles"]),"titles",len(d["clips"]),"clips")')"

      # Keep only the tiny JSON logs as an artifact (1 day). Videos are already
      # on YouTube, so we never store mp4s -> Actions storage stays near zero.
      - name: Upload run log (tiny, 1 day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: |
            output/**/storyboard.json
            output/**/summary.json
            output/channel_banner.jpg
            output/**/thumb_*.jpg
          retention-days: 1
          if-no-files-found: ignore

      # Wipe every generated file from the runner (videos, footage, audio).
      - name: Clean workspace
        if: always()
        run: |
          rm -rf output secrets
          df -h / | tail -1

      # Delete artifacts older than 1 day so storage can never fill up.
      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '1 day ago' +%s)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.created_at)"' | while read -r id created; do
              ts=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
              if [ "$ts" -lt "$CUTOFF" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" \
                  && echo "deleted artifact $id"
              fi
            done
