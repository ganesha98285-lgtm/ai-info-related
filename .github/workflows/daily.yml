name: Daily AI Shorts — AI Tool Drop

# Fully automatic and GPU-free: real HD stock footage + AI script + voice.
# Cron is UTC. 18:00 UTC ≈ 2:00 PM ET — builds a few hours before the first
# evening slot (6:00 PM ET), so all 6 shorts are queued for evening → late night.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      shorts_per_day:
        description: "How many shorts on THIS run (test = 1)"
        required: false
        default: "1"
      privacy:
        description: "public / unlisted / private (this run)"
        required: false
        default: "public"
      schedule_to_peak:
        description: "Schedule to prime time? true/false (this run)"
        required: false
        default: "false"
      theme:
        description: "Optional angle, e.g. 'free ai tools for students'"
        required: false
        default: ""
      no_upload:
        description: "Build only, skip posting (true/false)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write        # needed to prune old artifacts

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail fast: without a stock provider every video would be blank.
      - name: Check required secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          fail=0
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::No stock footage key. Add PEXELS_API_KEY (free: pexels.com/api)."
            fail=1
          fi
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::warning::YOUTUBE_TOKEN_JSON missing - uploads will be skipped."
          fi
          exit $fail

      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          fi
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          fi

      - name: Run daily pipeline
        env:
          # --- content / AI ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_FORMAT: ai_shorts
          # --- free stock footage (real HD video) ---
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # --- optional: AI b-roll on Modal's free GPU credits ---
          AI_BROLL: ${{ vars.AI_BROLL || 'false' }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # --- voice ---
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-GuyNeural' }}
          NARRATION_MODE: narrate
          # pacing: faster delivery + tiny breath between lines (no dead gaps)
          TTS_RATE: ${{ vars.TTS_RATE || '+10%' }}
          SCENE_PAD: ${{ vars.SCENE_PAD || '0.12' }}
          # --- how many + how to publish ---
          SHORTS_PER_DAY: ${{ github.event.inputs.shorts_per_day || vars.SHORTS_PER_DAY || '6' }}
          # quality + housekeeping
          VIDEO_QUALITY: ${{ vars.VIDEO_QUALITY || 'hd' }}
          VIDEO_CRF: ${{ vars.VIDEO_CRF || '18' }}
          CLEANUP_AFTER_UPLOAD: "true"
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
          SCHEDULE_TO_PEAK: ${{ github.event.inputs.schedule_to_peak || vars.SCHEDULE_TO_PEAK || 'true' }}
          UPLOAD_TARGETS: youtube
          # --- audience timing ---
          TARGET_TIMEZONE: America/New_York
          USA_TIMEZONE: America/New_York
          INDIA_TIMEZONE: Asia/Kolkata
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI Tool Drop' }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@aitooldrop' }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then EXTRA="--no-upload"; fi
          if [ -n "${{ github.event.inputs.theme }}" ]; then EXTRA="$EXTRA --theme \"${{ github.event.inputs.theme }}\""; fi
          eval python -m src.pipeline --once $EXTRA

      # Keep only the tiny JSON logs as an artifact (1 day). Videos are already
      # on YouTube, so we never store mp4s -> Actions storage stays near zero.
      - name: Upload run log (tiny, 1 day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: |
            output/**/storyboard.json
            output/**/summary.json
            output/channel_banner.jpg
            output/**/thumb_*.jpg
          retention-days: 1
          if-no-files-found: ignore

      # Wipe every generated file from the runner (videos, footage, audio).
      - name: Clean workspace
        if: always()
        run: |
          rm -rf output secrets
          df -h / | tail -1

      # Delete artifacts older than 1 day so storage can never fill up.
      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '1 day ago' +%s)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.created_at)"' | while read -r id created; do
              ts=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
              if [ "$ts" -lt "$CUTOFF" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" \
                  && echo "deleted artifact $id"
              fi
            done
